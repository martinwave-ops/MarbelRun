<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kuličky">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchicon" href="">
<title>Kuličky</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: sans-serif;
  }
  canvas {
    position: fixed; left: 0; top: 0;
    display: block; width: 100%; height: 100%; touch-action: none;
  }
  #ui {
    position: fixed; left: 10px; right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    justify-content: space-between;
    padding: 8px 12px; background: rgba(255,255,255,0.10);
    border-radius: 26px;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    touch-action: none;
  }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #colors { justify-content: flex-start; }
  #tools { justify-content: flex-end; margin-left: auto; }
  .color {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid transparent; box-sizing: border-box; cursor: pointer;
    transition: transform .1s, opacity .1s;
  }
  .color.active { border-color: #fff; transform: scale(1.15); }
  .color.dim { opacity: 0.35; }
  .btn {
    color: #fff; background: rgba(255,255,255,0.15); border: 2px solid transparent;
    border-radius: 18px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .btn.active { border-color: #fff; background: rgba(255,255,255,0.3); }
  .btn:active { background: rgba(255,255,255,0.35); }
  .btn.danger {
    background: rgba(255, 59, 48, 0.75);
    border-color: #ff3b30;
    font-weight: bold;
  }
  .btn.danger:active { background: #ff3b30; }

  /* šipky pro změnu barvy/zvuku nakreslených čar */
  #colorArrows {
    position: fixed; right: 10px; bottom: 90px;
    display: flex; gap: 8px; touch-action: none;
  }
  #colorArrows .btn {
    width: 52px; height: 52px; padding: 0; font-size: 22px;
    border-radius: 50%; background: rgba(255,255,255,0.18);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="group" id="colors"></div>
  <div class="group" id="tools"></div>
</div>
<div id="colorArrows">
  <button class="btn" id="arrowL" aria-label="Barva čar o krok doleva">◀</button>
  <button class="btn" id="arrowR" aria-label="Barva čar o krok doprava">▶</button>
</div>

<script>
// ---------- Zákaz zoomu a tahání stránky (iOS Safari) ----------
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

(() => {
  // ---------- Nastavení ----------
  // Pořadí barev = pořadí zvuků dopadu (viz IMPACT níže)
  const COLORS = ['#ff3b30', '#ff9500', '#ffe033', '#34c759', '#22c3ff', '#3b5bff', '#c648ff', '#ffffff'];
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
  const GRAVITY = 1800;        // px/s^2
  const BALL_R = 30;
  const LINE_W = 10;
  const ERASER_R = 40;         // poloměr gumy
  const DROP_INTERVAL = 0.5;
  const MAX_BALLS = 80;
  const SUBSTEPS = 8;
  const RESTITUTION = 0.65;        // sklo na tvrdém plastu (čára)
  const BALL_RESTITUTION = 0.88;   // sklo na skle (kulička o kuličku)
  const ROLL_FRICTION = 0.0003;    // tření při kutálení po plastu
  const MIN_POINT_DIST = 5;
  const CELL = 64;
  const SOUND_MIN_SPEED = 150;
  const GRAB_TOLERANCE = 12;
  const SHARDS_MIN = 11;
  const SHARDS_MAX = 16;
  const MAX_SHARDS = 400;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  // ---------- Ikona aplikace (kreslí se sama, není potřeba další soubor) ----------
  (function makeIcon() {
    try {
      const S = 180;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      g.fillStyle = '#0b0b10';
      g.fillRect(0, 0, S, S);
      const balls = [
        [58, 62, 34, '#ff3b30'],
        [122, 58, 30, '#22c3ff'],
        [90, 122, 36, '#ffe033'],
        [38, 128, 22, '#c648ff'],
        [146, 128, 22, '#34c759']
      ];
      for (const [x, y, r, col] of balls) {
        const rg = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.08, x - r * 0.1, y - r * 0.1, r * 1.1);
        rg.addColorStop(0, '#fff');
        rg.addColorStop(0.3, col);
        rg.addColorStop(1, '#000');
        g.fillStyle = rg;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.75)';
        g.beginPath(); g.arc(x - r * 0.38, y - r * 0.42, r * 0.17, 0, Math.PI * 2); g.fill();
      }
      const url = c.toDataURL('image/png');
      document.getElementById('touchicon').href = url;
      document.getElementById('favicon').href = url;
    } catch (e) { /* ikona není kritická */ }
  })();

  // ---------- Zásobník (poloha) ----------
  const FEED_MARGIN = 64;      // místo pro šipky u kraje obrazovky
  const FEED = { x: FEED_MARGIN, y: 14, w: 130, h: 110, taper: 28 };
  const hatchY = FEED.y + FEED.h;
  const hatchX = () => FEED.x + FEED.w / 2;
  let feedSlot = 0;            // 0 = vlevo, 1 = uprostřed, 2 = vpravo
  let feedTargetX = FEED.x;

  function slotX(slot) {
    if (slot === 0) return FEED_MARGIN;
    if (slot === 2) return Math.max(FEED_MARGIN, W - FEED.w - FEED_MARGIN);
    return Math.max(FEED_MARGIN, (W - FEED.w) / 2);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    feedTargetX = slotX(feedSlot);
    FEED.x = feedTargetX;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  // ---------- 3D vzhled koulí ----------
  // f > 0 = přimíchá bílou, f < 0 = přimíchá černou
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = f > 0 ? 255 : 0, a = Math.abs(f);
    r = Math.round(r + (t - r) * a);
    g = Math.round(g + (t - g) * a);
    b = Math.round(b + (t - b) * a);
    return `rgb(${r},${g},${b})`;
  }

  // světlo je vlevo nahoře
  function drawSphere(x, y, r, color) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    // základní stínování koule
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.08, x - r * 0.1, y - r * 0.1, r * 1.1);
    g.addColorStop(0, shade(color, 0.6));
    g.addColorStop(0.3, shade(color, 0.1));
    g.addColorStop(0.7, shade(color, -0.35));
    g.addColorStop(1, shade(color, -0.7));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    // odražené světlo dole vpravo
    const bg = ctx.createRadialGradient(x + r * 0.35, y + r * 0.6, 0, x + r * 0.35, y + r * 0.6, r * 0.7);
    bg.addColorStop(0, 'rgba(255,255,255,0.22)');
    bg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    // ostrý odlesk
    const sx = x - r * 0.4, sy = y - r * 0.45;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.38);
    sg.addColorStop(0, 'rgba(255,255,255,0.95)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.45)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    ctx.restore();
  }

  // ---------- 3D vzhled čar ----------
  const STROKE_DARK  = COLORS.map(c => shade(c, -0.5));
  const STROKE_LIGHT = COLORS.map(c => shade(c, 0.45));

  function strokePath(st, ox, oy) {
    const p = st.pts;
    ctx.beginPath();
    ctx.moveTo(p[0].x + ox, p[0].y + oy);
    if (p.length === 1) ctx.lineTo(p[0].x + ox + 0.01, p[0].y + oy);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x + ox, p[i].y + oy);
  }

  function drawStroke(st) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // tmavý okraj (spodní strana trubičky)
    ctx.strokeStyle = STROKE_DARK[st.n];
    ctx.lineWidth = LINE_W + 1;
    strokePath(st, 0, 0);
    ctx.stroke();

    // základní barva
    ctx.strokeStyle = st.color;
    ctx.lineWidth = LINE_W - 1;
    strokePath(st, 0, 0);
    ctx.stroke();

    // světlejší střed posunutý ke světlu (vlevo nahoře)
    ctx.strokeStyle = STROKE_LIGHT[st.n];
    ctx.lineWidth = LINE_W * 0.5;
    strokePath(st, -0.8, -1);
    ctx.stroke();

    // tenký ostrý odlesk
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.6;
    strokePath(st, -1.4, -1.8);
    ctx.stroke();
  }

  // ---------- Zvuk ----------
  let audio = null, master = null, muted = false, voices = 0;
  let noiseBuf = null, lastBreak = 0;

  function initAudio() {
    if (audio) {
      if (audio.state !== 'running') audio.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    const comp = audio.createDynamicsCompressor();
    master = audio.createGain();
    master.gain.value = 0.8;
    master.connect(comp);
    comp.connect(audio.destination);
    // tichý zvuk, který na iOS definitivně odemkne přehrávání
    try {
      const b = audio.createBuffer(1, 1, 22050);
      const s = audio.createBufferSource();
      s.buffer = b; s.connect(audio.destination); s.start(0);
    } catch (e) {}
    if (audio.state !== 'running') audio.resume();
  }
  // iOS odemyká zvuk jen při některých událostech – zkusíme všechny
  ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'keydown'].forEach(ev =>
    document.addEventListener(ev, initAudio, { passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audio && audio.state !== 'running') audio.resume();
  });

  function getNoise() {
    if (noiseBuf) return noiseBuf;
    const len = audio.sampleRate;
    noiseBuf = audio.createBuffer(1, len, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function noiseBurst(t, dur, vol, type, freq, q) {
    const src = audio.createBufferSource();
    src.buffer = getNoise();
    src.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = audio.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = audio.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);
  }

  // jeden tón s ohybem výšky a doznívající hlasitostí
  // count = true → počítá se do limitu současných hlasů
  function tone(type, f0, f1, t, dur, vol, dest, count) {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.02);
    if (count) { voices++; o.onended = () => { voices--; }; }
    return o;
  }

  const volOf = speed => Math.min(1, 0.2 + speed / 1000) * 0.35;
  const rnd = (a, b) => a + Math.random() * (b - a);

  // --- zvuky dopadu: jeden pro každou barvu čáry ---

  // 4: světle modrá – původní zvonivé cinknutí
  function sndBell(speed) {
    const t = audio.currentTime;
    const f = NOTES[4];
    const vol = volOf(speed);

    const g = audio.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
    g.connect(master);

    const o1 = audio.createOscillator();
    o1.type = 'sine'; o1.frequency.value = f;
    o1.connect(g);

    const g2 = audio.createGain();
    g2.gain.setValueAtTime(0.3, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    g2.connect(g);
    const o2 = audio.createOscillator();
    o2.type = 'sine'; o2.frequency.value = f * 2.76;
    o2.connect(g2);

    voices++;
    o1.onended = () => { voices--; };
    o1.start(t); o2.start(t);
    o1.stop(t + 1.05); o2.stop(t + 0.3);
  }

  // 0: červená – buben
  function sndDrum(speed) {
    const t = audio.currentTime, v = volOf(speed);
    tone('sine', rnd(175, 205), 55, t, 0.28, v * 2.2, null, true);
    noiseBurst(t, 0.03, v * 0.8, 'lowpass', 1500, 0.7);
  }

  // 1: oranžová – dřevěný blok
  function sndWood(speed) {
    const t = audio.currentTime, v = volOf(speed);
    const f = rnd(760, 880);
    tone('triangle', f, f, t, 0.11, v * 1.7, null, true);
    tone('sine', f * 2, f * 2, t, 0.05, v * 0.8);
    noiseBurst(t, 0.02, v * 0.6, 'bandpass', 2500, 2);
  }

  // 2: žlutá – drnknutí struny
  function sndPluck(speed) {
    const t = audio.currentTime, v = volOf(speed);
    const filt = audio.createBiquadFilter();
    filt.type = 'lowpass'; filt.Q.value = 6;
    filt.frequency.setValueAtTime(3500, t);
    filt.frequency.exponentialRampToValueAtTime(250, t + 0.35);
    filt.connect(master);
    const f = 392;
    tone('sawtooth', f, f, t, 0.45, v * 0.8, filt, true);
    tone('sawtooth', f * 1.006, f * 1.006, t, 0.45, v * 0.8, filt);
  }

  // 3: zelená – bublinka
  function sndBubble(speed) {
    const t = audio.currentTime, v = volOf(speed);
    const f = rnd(330, 480);
    tone('sine', f, f * 3.2, t, 0.14, v * 1.7, null, true);
    tone('sine', f * 1.5, f * 4, t + 0.07, 0.1, v * 0.7);
  }

  // 5: tmavě modrá – hluboký gong
  function sndGong(speed) {
    const t = audio.currentTime, v = volOf(speed);
    const b = 130.81;
    tone('sine', b, b, t, 1.5, v * 1.5, null, true);
    tone('sine', b * 2.01, b * 2.01, t, 0.9, v * 0.6);
    tone('sine', b * 3.2, b * 3.2, t, 0.5, v * 0.35);
    noiseBurst(t, 0.04, v * 0.5, 'lowpass', 800, 0.7);
  }

  // 6: fialová – laser
  function sndLaser(speed) {
    const t = audio.currentTime, v = volOf(speed);
    const filt = audio.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 2500;
    filt.connect(master);
    tone('square', 1500, 260, t, 0.22, v * 0.7, filt, true);
  }

  // 7: bílá – malý bubínek / klik
  function sndSnare(speed) {
    const t = audio.currentTime, v = volOf(speed);
    noiseBurst(t, 0.16, v * 1.3, 'highpass', 1800, 0.7);
    tone('triangle', 230, 140, t, 0.1, v, null, true);
  }

  const IMPACT = [sndDrum, sndWood, sndPluck, sndBubble, sndBell, sndGong, sndLaser, sndSnare];

  function chime(idx, speed) {
    if (!audio || muted || voices >= 14) return;
    IMPACT[idx % IMPACT.length](speed);
  }

  // --- zvuk rozbití skla ---
  function glassBreak() {
    if (!audio || muted) return;
    const nowMs = performance.now();
    if (nowMs - lastBreak < 40) return;
    lastBreak = nowMs;
    const t = audio.currentTime;

    noiseBurst(t, 0.05, 0.8, 'highpass', 3000, 0.7);
    noiseBurst(t, 0.4, 0.35, 'bandpass', 5500, 0.8);
    noiseBurst(t + 0.03, 0.25, 0.2, 'highpass', 7000, 0.7);

    {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(380, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 0.08);
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.12);
    }

    const n = 10 + Math.floor(Math.random() * 7);
    for (let i = 0; i < n; i++) {
      const st = t + 0.02 + Math.pow(Math.random(), 1.6) * 0.5;
      const f = 2200 + Math.random() * 5200;
      const dur = 0.05 + Math.random() * 0.18;
      const vol = 0.05 + Math.random() * 0.13;
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = Math.random() < 0.5 ? 'sine' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(vol, st + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(g); g.connect(master);
      o.start(st); o.stop(st + dur + 0.02);
    }
  }

  // ---------- Stav ----------
  let currentIdx = 4;
  let tool = 'brush';          // 'brush' | 'erase' | 'break'
  const strokes = [];
  const balls = [];
  const shards = [];
  const flashes = [];
  const grid = new Map();
  const active = new Map();
  const drags = new Map();
  const previews = new Map();
  let feederPointer = null;
  let feederTimer = 0;
  let hatch = 0;

  const feederBalls = [];
  for (let i = 0; i < 12; i++) {
    feederBalls.push({
      x: 0.2 + Math.random() * 0.6,
      y: 0.15 + Math.random() * 0.6,
      c: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  }

  // ---------- UI ----------
  const ui = document.getElementById('ui');
  const colorsBox = document.getElementById('colors');   // vlevo: barvy
  const toolsBox = document.getElementById('tools');     // vpravo: ikony / tlačítka
  const colorEls = [];
  const stop = e => e.stopPropagation();
  ui.addEventListener('pointerdown', e => { stop(e); initAudio(); });

  COLORS.forEach((col, i) => {
    const b = document.createElement('div');
    b.className = 'color' + (i === currentIdx ? ' active' : '');
    b.style.background = col;
    b.addEventListener('pointerdown', () => {
      currentIdx = i;
      setTool('brush');
    });
    colorsBox.appendChild(b);
    colorEls.push(b);
  });

  function addButton(text, fn) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = text;
    b.addEventListener('pointerdown', () => fn(b));
    toolsBox.appendChild(b);
    return b;
  }
  const brushBtn = addButton('✏️ Štětec', () => setTool('brush'));
  const eraseBtn = addButton('🧽 Guma', () => setTool('erase'));
  const breakBtn = addButton('💥 Rozbít', () => setTool('break'));
  addButton('↩ Zpět', () => { strokes.pop(); rebuildGrid(); });

  // Smazat: zmizí jen nakreslené čáry, kuličky zůstanou a padají dál
  const clearBtn = addButton('🗑 Smazat', () => {
    strokes.length = 0;
    for (const [id, a] of active) if (a.type === 'draw') active.delete(id);
    rebuildGrid();
  });
  clearBtn.classList.add('danger');

  const muteBtn = addButton('🔊', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  function setTool(t) { tool = t; refreshUI(); }
  function refreshUI() {
    colorEls.forEach((el, i) => {
      el.classList.toggle('active', tool === 'brush' && i === currentIdx);
      el.classList.toggle('dim', tool !== 'brush');
    });
    brushBtn.classList.toggle('active', tool === 'brush');
    eraseBtn.classList.toggle('active', tool === 'erase');
    breakBtn.classList.toggle('active', tool === 'break');
    canvas.style.cursor = tool === 'break' ? 'crosshair' : 'default';
  }
  refreshUI();

  // ---------- Šipky: posun barvy/zvuku nakreslených čar ----------
  const arrowsEl = document.getElementById('colorArrows');

  // dir = -1 (doleva) / +1 (doprava); mění barvu i zvuk (n) všech čar
  function shiftStrokeColors(dir) {
    const n = COLORS.length;
    for (const st of strokes) {
      st.n = (st.n + dir + n) % n;
      st.color = COLORS[st.n];
    }
    rebuildGrid(); // segmenty si berou zvuk z čísla barvy
  }

  function bindArrow(id, dir) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      shiftStrokeColors(dir);
    });
  }
  bindArrow('arrowL', -1);
  bindArrow('arrowR', +1);

  // šipky vždy těsně nad spodní lištou (i s odsazením od home indikátoru)
  function positionArrows() {
    const top = ui.getBoundingClientRect().top;
    arrowsEl.style.bottom = Math.round(window.innerHeight - top + 10) + 'px';
  }
  window.addEventListener('resize', positionArrows);
  window.addEventListener('orientationchange', () => setTimeout(positionArrows, 250));
  if (window.ResizeObserver) new ResizeObserver(positionArrows).observe(ui);
  positionArrows();

  // ---------- Mřížka segmentů ----------
  const key = (cx, cy) => cx * 100003 + cy;
  function insertSegment(s) {
    const x0 = Math.floor(Math.min(s.ax, s.bx) / CELL), x1 = Math.floor(Math.max(s.ax, s.bx) / CELL);
    const y0 = Math.floor(Math.min(s.ay, s.by) / CELL), y1 = Math.floor(Math.max(s.ay, s.by) / CELL);
    for (let cx = x0; cx <= x1; cx++)
      for (let cy = y0; cy <= y1; cy++) {
        const k = key(cx, cy);
        let arr = grid.get(k);
        if (!arr) grid.set(k, arr = []);
        arr.push(s);
      }
  }
  function rebuildGrid() {
    grid.clear();
    for (const st of strokes) {
      const p = st.pts;
      if (p.length === 1) insertSegment({ ax: p[0].x, ay: p[0].y, bx: p[0].x, by: p[0].y, n: st.n });
      for (let i = 1; i < p.length; i++)
        insertSegment({ ax: p[i-1].x, ay: p[i-1].y, bx: p[i].x, by: p[i].y, n: st.n });
    }
  }

  // ---------- Guma ----------
  function distToSeg(ax, ay, bx, by, px, py) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }

  function eraseAt(x, y) {
    const R = ERASER_R;
    let changed = false;
    const out = [];
    for (const st of strokes) {
      const p = st.pts;
      if (p.length === 1) {
        if (Math.hypot(p[0].x - x, p[0].y - y) < R) changed = true; else out.push(st);
        continue;
      }
      let run = [], parts = [], touched = false;
      for (let i = 1; i < p.length; i++) {
        if (distToSeg(p[i-1].x, p[i-1].y, p[i].x, p[i].y, x, y) < R) {
          touched = true;
          if (run.length) { parts.push(run); run = []; }
        } else {
          if (!run.length) run.push(p[i-1]);
          run.push(p[i]);
        }
      }
      if (run.length) parts.push(run);
      if (!touched) out.push(st);
      else {
        changed = true;
        for (const r of parts) out.push({ color: st.color, n: st.n, pts: r });
      }
    }
    if (changed) {
      strokes.length = 0;
      for (const s of out) strokes.push(s);
      rebuildGrid();
    }
  }
  function eraseLine(x0, y0, x1, y1) {
    const d = Math.hypot(x1 - x0, y1 - y0);
    const n = Math.max(1, Math.ceil(d / (ERASER_R * 0.5)));
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      eraseAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
  }

  // ---------- Rozbití kuličky ----------
  function shatter(b) {
    for (const [id, d] of drags) if (d.ball === b) drags.delete(id);

    const n = SHARDS_MIN + Math.floor(Math.random() * (SHARDS_MAX - SHARDS_MIN + 1));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * BALL_R * 0.8;
      const sp = 150 + Math.random() * 450;
      const size = 6 + Math.random() * 11;
      const pts = [];
      const base = Math.random() * Math.PI * 2;
      for (let k = 0; k < 3; k++) {
        const ang = base + k * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.9;
        const rad = size * (0.5 + Math.random() * 0.7);
        pts.push(Math.cos(ang) * rad, Math.sin(ang) * rad);
      }
      const life = 0.45 + Math.random() * 0.4;
      shards.push({
        x: b.x + Math.cos(a) * r,
        y: b.y + Math.sin(a) * r,
        vx: Math.cos(a) * sp + b.vx * 0.4,
        vy: Math.sin(a) * sp - 120 + b.vy * 0.4,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 24,
        life, maxLife: life,
        color: b.color,
        pts
      });
    }
    while (shards.length > MAX_SHARDS) shards.shift();

    flashes.push({ x: b.x, y: b.y, t: 0, dur: 0.18 });

    const idx = balls.indexOf(b);
    if (idx >= 0) balls.splice(idx, 1);
    glassBreak();
  }

  // rozbije všechny kuličky, kterých se dotkne tah prstu z bodu A do bodu B
  function breakAlong(x0, y0, x1, y1) {
    const hit = [];
    for (const b of balls) {
      if (distToSeg(x0, y0, x1, y1, b.x, b.y) <= BALL_R + GRAB_TOLERANCE) hit.push(b);
    }
    for (const b of hit) shatter(b);
  }

  function updateEffects(dt) {
    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      s.life -= dt;
      if (s.life <= 0 || s.y > H + 100) { shards.splice(i, 1); continue; }
      s.vy += GRAVITY * dt;
      s.vx *= 1 - 1.5 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.rot += s.vr * dt;
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      flashes[i].t += dt;
      if (flashes[i].t >= flashes[i].dur) flashes.splice(i, 1);
    }
  }

  // ---------- Zásobník: vstup a šipky ----------
  const ARROW_DIST = 30;       // vzdálenost středu šipky od zásobníku
  const ARROW_R = 22;          // vizuální poloměr tlačítka šipky
  const ARROW_HIT = 28;        // poloměr pro dotyk

  function arrowCenter(dir) {
    const cy = FEED.y + FEED.h / 2;
    return dir < 0
      ? { x: FEED.x - ARROW_DIST, y: cy }
      : { x: FEED.x + FEED.w + ARROW_DIST, y: cy };
  }
  function arrowEnabled(dir) {
    const s = feedSlot + dir;
    return s >= 0 && s <= 2;
  }
  // vrací -1 / +1, když bod zasáhl šipku, jinak 0
  function arrowAt(x, y) {
    for (const dir of [-1, 1]) {
      const c = arrowCenter(dir);
      if (Math.hypot(x - c.x, y - c.y) <= ARROW_HIT) return dir;
    }
    return 0;
  }
  function moveFeeder(dir) {
    if (!arrowEnabled(dir)) return;
    feedSlot += dir;
    feedTargetX = slotX(feedSlot);
  }

  function inFeeder(x, y) {
    return x >= FEED.x - 6 && x <= FEED.x + FEED.w + 6 && y >= FEED.y - 6 && y <= FEED.y + FEED.h + 20;
  }

  function dropBall() {
    const ci = Math.floor(Math.random() * COLORS.length);
    const nb = {
      x: hatchX() + (Math.random() - 0.5) * 8,
      y: hatchY + BALL_R - 6,
      vx: (Math.random() - 0.5) * 30,
      vy: 60,
      color: COLORS[ci],
      drag: false, hit: 0, hitN: 0, lastSnd: 0
    };
    balls.push(nb);
    if (balls.length > MAX_BALLS) {
      const idx = balls.findIndex(b => !b.drag);
      if (idx >= 0) balls.splice(idx, 1);
    }
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    canvas.setPointerCapture(e.pointerId);
    const x = e.clientX, y = e.clientY, id = e.pointerId;

    // 0) šipky pro přesun zásobníku
    const dir = arrowAt(x, y);
    if (dir !== 0) { moveFeeder(dir); return; }

    // 1) zásobník
    if (inFeeder(x, y)) {
      if (feederPointer === null) {
        feederPointer = id;
        feederTimer = 0;
        dropBall();
      }
      return;
    }

    // 2) nástroj Rozbít – klepnutí nebo tah prstu přes kuličky je rozbije
    if (tool === 'break') {
      active.set(id, { type: 'break', lx: x, ly: y });
      breakAlong(x, y, x, y);
      return;
    }

    // 3) chycení kuličky (drag & drop) – s gumou je vypnuté
    if (tool !== 'erase') {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (!b.drag && Math.hypot(b.x - x, b.y - y) <= BALL_R + GRAB_TOLERANCE) {
          b.drag = true; b.vx = 0; b.vy = 0;
          drags.set(id, { ball: b, ox: b.x - x, oy: b.y - y, tx: x, ty: y });
          return;
        }
      }
    }

    // 4) guma
    if (tool === 'erase') {
      active.set(id, { type: 'erase', lx: x, ly: y });
      previews.set(id, { x, y });
      eraseAt(x, y);
      return;
    }

    // 5) štětec
    const st = { color: COLORS[currentIdx], n: currentIdx, pts: [{ x, y }] };
    strokes.push(st);
    active.set(id, { type: 'draw', st });
    insertSegment({ ax: x, ay: y, bx: x, by: y, n: st.n });
  });

  canvas.addEventListener('pointermove', e => {
    const id = e.pointerId;
    e.preventDefault();

    if (tool === 'erase' && (e.pointerType === 'mouse' || active.has(id))) {
      previews.set(id, { x: e.clientX, y: e.clientY });
    }

    const d = drags.get(id);
    if (d) { d.tx = e.clientX; d.ty = e.clientY; return; }

    const a = active.get(id);
    if (!a) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const x = ev.clientX, y = ev.clientY;
      if (a.type === 'draw') {
        const st = a.st;
        const last = st.pts[st.pts.length - 1];
        if (Math.hypot(x - last.x, y - last.y) >= MIN_POINT_DIST) {
          st.pts.push({ x, y });
          insertSegment({ ax: last.x, ay: last.y, bx: x, by: y, n: st.n });
        }
      } else if (a.type === 'erase') {
        eraseLine(a.lx, a.ly, x, y);
        a.lx = x; a.ly = y;
      } else if (a.type === 'break') {
        breakAlong(a.lx, a.ly, x, y);
        a.lx = x; a.ly = y;
      }
    }
  });

  function endPointer(e) {
    const id = e.pointerId;
    if (id === feederPointer) feederPointer = null;
    const d = drags.get(id);
    if (d) {
      d.ball.drag = false;
      const sp = Math.hypot(d.ball.vx, d.ball.vy);
      if (sp > 1800) { d.ball.vx *= 1800 / sp; d.ball.vy *= 1800 / sp; }
      drags.delete(id);
    }
    active.delete(id);
    if (e.pointerType !== 'mouse') previews.delete(id);
  }
  canvas.addEventListener('pointerup', e => { endPointer(e); initAudio(); });
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') previews.delete(e.pointerId); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Fyzika ----------
  function collideSegments(b) {
    const reach = BALL_R + LINE_W / 2;
    const x0 = Math.floor((b.x - reach) / CELL), x1 = Math.floor((b.x + reach) / CELL);
    const y0 = Math.floor((b.y - reach) / CELL), y1 = Math.floor((b.y + reach) / CELL);
    for (let cx = x0; cx <= x1; cx++)
      for (let cy = y0; cy <= y1; cy++) {
        const arr = grid.get(key(cx, cy));
        if (!arr) continue;
        for (let i = 0; i < arr.length; i++) {
          const s = arr[i];
          const dx = s.bx - s.ax, dy = s.by - s.ay;
          const l2 = dx * dx + dy * dy;
          let t = l2 > 0 ? ((b.x - s.ax) * dx + (b.y - s.ay) * dy) / l2 : 0;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const px = s.ax + dx * t, py = s.ay + dy * t;
          let nx = b.x - px, ny = b.y - py;
          const d2 = nx * nx + ny * ny;
          if (d2 >= reach * reach) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-6) {
            const L = Math.sqrt(l2) || 1;
            nx = -dy / L; ny = dx / L; d = 0;
            if (l2 === 0) { nx = 0; ny = -1; }
          } else { nx /= d; ny /= d; }
          b.x = px + nx * reach; b.y = py + ny * reach;
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) {
            if (-vn > SOUND_MIN_SPEED && -vn > b.hit) { b.hit = -vn; b.hitN = s.n; }
            const e = -vn > 120 ? RESTITUTION : 0;
            b.vx -= (1 + e) * vn * nx;
            b.vy -= (1 + e) * vn * ny;
            const tx = -ny, ty = nx;
            const vt = b.vx * tx + b.vy * ty;
            const f = vt * ROLL_FRICTION;
            b.vx -= f * tx; b.vy -= f * ty;
          }
        }
      }
  }

  function collideBalls() {
    const D = BALL_R * 2;
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      if (a.drag) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j];
        if (b.drag) continue;
        const dx = b.x - a.x;
        if (dx > D || dx < -D) continue;
        const dy = b.y - a.y;
        if (dy > D || dy < -D) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= D * D || d2 === 0) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const push = (D - d) / 2;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          const e = -rel > 100 ? BALL_RESTITUTION : 0;
          const imp = -(1 + e) * rel / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }

  function step(dt) {
    const h = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (const b of balls) {
        if (b.drag) continue;
        b.vy += GRAVITY * h;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 2000) { b.vx *= 2000 / sp; b.vy *= 2000 / sp; }
        b.x += b.vx * h; b.y += b.vy * h;
        collideSegments(b);
      }
      collideBalls();
      for (const b of balls) if (!b.drag) collideSegments(b);
    }

    const now = performance.now();
    for (const b of balls) {
      if (b.hit > 0) {
        if (now - b.lastSnd > 70) { chime(b.hitN, b.hit); b.lastSnd = now; }
        b.hit = 0;
      }
    }

    // kuličky, které propadnou mimo obrazovku, zmizí
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (!b.drag && (b.y > H + 80 || b.x < -120 || b.x > W + 120)) balls.splice(i, 1);
    }

    updateEffects(dt);
  }

  // ---------- Kreslení ----------
  function feederPath() {
    const { x, y, w, h, taper } = FEED;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - taper, y + h);
    ctx.lineTo(x + taper, y + h);
    ctx.closePath();
  }

  function drawFeeder() {
    const { x, y, w, h, taper } = FEED;
    ctx.save();
    feederPath();
    ctx.fillStyle = '#15151a';
    ctx.fill();
    ctx.clip();
    for (const fb of feederBalls) {
      drawSphere(x + fb.x * w, y + fb.y * h, 16, fb.c);
    }
    ctx.restore();
    feederPath();
    ctx.strokeStyle = feederPointer !== null ? '#fff' : '#888';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();

    const L = (w - 2 * taper) / 2;
    const ang = hatch * 1.2;
    const bx = y + h + 1;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + taper, bx);
    ctx.lineTo(x + taper + L * Math.cos(ang), bx + L * Math.sin(ang));
    ctx.moveTo(x + w - taper, bx);
    ctx.lineTo(x + w - taper - L * Math.cos(ang), bx + L * Math.sin(ang));
    ctx.stroke();

    drawArrows();
  }

  function drawArrows() {
    for (const dir of [-1, 1]) {
      const c = arrowCenter(dir);
      const on = arrowEnabled(dir);
      ctx.save();
      ctx.globalAlpha = on ? 1 : 0.25;
      ctx.beginPath();
      ctx.arc(c.x, c.y, ARROW_R, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      // trojúhelník
      const s = 8;
      ctx.beginPath();
      ctx.moveTo(c.x + dir * s, c.y);
      ctx.lineTo(c.x - dir * s * 0.7, c.y - s);
      ctx.lineTo(c.x - dir * s * 0.7, c.y + s);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEffects() {
    for (const f of flashes) {
      const p = f.t / f.dur;
      ctx.beginPath();
      ctx.arc(f.x, f.y, BALL_R * (0.8 + p * 1.2), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${(1 - p) * 0.9})`;
      ctx.lineWidth = 3 * (1 - p) + 1;
      ctx.stroke();
    }
    for (const s of shards) {
      const a = Math.max(0, Math.min(1, s.life / s.maxLife));
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(s.pts[0], s.pts[1]);
      ctx.lineTo(s.pts[2], s.pts[3]);
      ctx.lineTo(s.pts[4], s.pts[5]);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (const st of strokes) drawStroke(st);

    for (const b of balls) {
      drawSphere(b.x, b.y, BALL_R, b.color);
      if (b.drag) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_R + 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    drawEffects();
    drawFeeder();

    if (tool === 'erase') {
      for (const p of previews.values()) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, ERASER_R, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // ---------- Hlavní smyčka ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30;
    if (dt < 0.001) dt = 0.001;

    // plynulý přesun zásobníku
    const dx = feedTargetX - FEED.x;
    if (Math.abs(dx) < 0.5) FEED.x = feedTargetX;
    else FEED.x += dx * Math.min(1, dt * 12);

    if (feederPointer !== null) {
      feederTimer += dt;
      while (feederTimer >= DROP_INTERVAL) {
        feederTimer -= DROP_INTERVAL;
        dropBall();
      }
      hatch = Math.min(1, hatch + dt * 10);
    } else {
      hatch = Math.max(0, hatch - dt * 10);
      feederTimer = 0;
    }

    for (const d of drags.values()) {
      const b = d.ball;
      const nx = Math.min(W, Math.max(0, d.tx + d.ox));
      const ny = Math.min(H, Math.max(0, d.ty + d.oy));
      const ivx = (nx - b.x) / dt, ivy = (ny - b.y) / dt;
      b.vx += (ivx - b.vx) * 0.35;
      b.vy += (ivy - b.vy) * 0.35;
      b.x = nx; b.y = ny;
    }

    step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
